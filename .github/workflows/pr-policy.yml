name: PR Policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  issue-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Verify linked Issue
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const actor = pr.user.login;
            if (actor === 'dependabot[bot]') {
              core.info('Dependabot pull requests are exempt from the Issue-first policy.');
              return;
            }

            const text = `${pr.title}\n${pr.body || ''}`;
            const pattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi;
            const issueNumbers = [...text.matchAll(pattern)].map((match) => Number(match[1]));

            if (issueNumbers.length === 0) {
              core.setFailed('Binaru uses an Issue-first workflow. Reference an existing Issue with Closes #123, Fixes #123, or Resolves #123.');
              return;
            }

            for (const issue_number of [...new Set(issueNumbers)]) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                });
                if (!issue.pull_request) {
                  core.info(`Validated repository Issue #${issue_number}.`);
                  return;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            core.setFailed('No referenced number is an existing Issue in this repository. Pull requests do not satisfy the Issue-first policy.');
