name: Feature request
description: Propose an improvement to Binaru
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or learning problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the outcome you propose, without assuming a specific implementation.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Learning or product impact
      description: How would this improve the learner, parent, or product experience?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add non-sensitive references, mockups, or context if useful.
