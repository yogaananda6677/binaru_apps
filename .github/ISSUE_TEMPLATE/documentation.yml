name: Documentation issue
description: Report missing, incorrect, or unclear documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: affected
    attributes:
      label: Affected documentation
      description: Link to or name the affected file or section.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Issue
      description: Explain what is missing, incorrect, or unclear.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
      description: Describe how the documentation could be improved.
    validations:
      required: true
